# Smithery server manifest. stdio through npx, no configuration: every tool is a read-only
# lookup over public data, so there is no key to collect.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'blockdex-mcp'],
      env: {}
    })
  exampleConfig: {}
